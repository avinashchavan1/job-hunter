appId: app.jobhunter.desktop
productName: Job Hunter
copyright: Copyright © 2026 Avinash Chavan
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  identity: "-"
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: false
    NSUserNotificationAlertStyle: alert
  notarize: false
dmg:
  artifactName: Job-Hunter-${version}-${arch}.${ext}
  title: Job Hunter
win:
  executableName: job-hunter
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true
nsis:
  artifactName: Job-Hunter-${version}-setup.${ext}
  shortcutName: Job Hunter
  uninstallDisplayName: Job Hunter
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
linux:
  target: [AppImage]
  category: Utility
appImage:
  artifactName: Job-Hunter-${version}.${ext}
npmRebuild: false
toolsets:
  nsis: "1.2.1"
